# Publishes @agentreel/agent to npm with provenance, on the dist-tag that
# matches the git tag:
#   vX.Y.Z          -> latest
#   vX.Y.Z-alpha.N  -> alpha
#   vX.Y.Z-beta.N   -> beta
# The tag, apps/local-agent/package.json version and dist-tag must agree, the
# commit must be on main, and the version must not already be on npm, or the
# run fails before anything is published (scripts/assert-publish-channel.sh).
#
# Auth is npm trusted publishing (OIDC). There is no NODE_AUTH_TOKEN secret.
# The trusted publisher on npmjs.com must point at agentreel/agent and this
# file (publish.yml). Keep this filename.
#
# The publish job runs in the protected `npm-publish` GitHub Environment.
# It must exist, with Navjot as a required reviewer, before any release tag
# is pushed. GitHub creates a missing environment with no protection.
name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    outputs:
      channel: ${{ steps.guard.outputs.channel }}
      version: ${{ steps.guard.outputs.version }}
      tag: ${{ steps.guard.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (uses packageManager from package.json)

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Upgrade npm (trusted publishing needs npm 11.5.1 or newer)
        run: |
          npm install -g npm@11
          npm --version

      - name: Check tag, version, channel, main and npm
        id: guard
        run: bash scripts/assert-publish-channel.sh

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --log-opts=--all .

      - name: Pack dry run
        working-directory: apps/local-agent
        run: npm pack --dry-run

      - name: Publish with provenance to the matching dist-tag
        working-directory: apps/local-agent
        env:
          CHANNEL: ${{ steps.guard.outputs.channel }}
          EXPECTED_VERSION: ${{ steps.guard.outputs.version }}
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          case "${CHANNEL}" in
            latest) [[ "${PKG_VERSION}" != *-* ]] || { echo "Refusing to publish prerelease ${PKG_VERSION} to latest" >&2; exit 1; } ;;
            alpha|beta) [[ "${PKG_VERSION}" == *"-${CHANNEL}."* ]] || { echo "Refusing to publish ${PKG_VERSION} to ${CHANNEL}" >&2; exit 1; } ;;
            *) echo "Unexpected channel '${CHANNEL}'" >&2; exit 1 ;;
          esac
          if [ "${PKG_VERSION}" != "${EXPECTED_VERSION}" ]; then
            echo "package.json changed during the run: ${PKG_VERSION} != ${EXPECTED_VERSION}" >&2
            exit 1
          fi
          npm publish --tag "${CHANNEL}" --provenance --access public

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create GitHub release (prerelease for alpha and beta)
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.publish.outputs.channel }}
          TAG: ${{ needs.publish.outputs.tag }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          NOTES=".github/release-notes/v${VERSION}.md"
          if [ "${CHANNEL}" = "latest" ]; then
            FLAGS=(--latest)
          else
            FLAGS=(--prerelease --latest=false)
          fi
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "${TAG}" \
            --notes-file "${NOTES}" \
            "${FLAGS[@]}"
