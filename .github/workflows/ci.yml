# Pull request CI: install, typecheck, test and build on every PR and on pushes to main.
# Read-only token, no secrets, no publish. Releases stay in publish.yml.
name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # engines.node is ">=20"; publish.yml builds on 22.
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (uses packageManager from package.json)

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Pack the published package and audit only its production tree, matching
      # what `npm i @agentreel/agent` installs. Fails the job on high or critical.
      - name: Audit published production dependencies
        run: |
          set -euo pipefail
          pack_dir="${RUNNER_TEMP}/agentreel-pack"
          audit_dir="${RUNNER_TEMP}/agentreel-audit"
          mkdir -p "$pack_dir" "$audit_dir"
          pnpm --filter @agentreel/agent pack --pack-destination "$pack_dir"
          tarball="$(ls "$pack_dir"/agentreel-agent-*.tgz)"
          cd "$audit_dir"
          npm init -y
          npm install "$tarball"
          npm audit --omit=dev --audit-level=high

  # Built-bundle hook self-check on Windows, including the cmd NODE_OPTIONS
  # scrub and the missing-wrapper fail-closed case. Not a full test matrix:
  # other suites still assume a POSIX shell.
  windows-hook-selfcheck:
    name: hook self-check (Windows, Node 22)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (uses packageManager from package.json)

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter @agentreel/agent build

      - name: Hook self-check tests
        working-directory: apps/local-agent
        run: pnpm exec vitest run test/node-options-selfcheck-bundle.test.ts test/hook-command-scrub.test.ts test/managed-install.test.ts
